name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Staff emails match firestore.rules
        run: npm run check:config
        env:
          VITE_OWNER_EMAILS: ${{ vars.VITE_OWNER_EMAILS }}
          VITE_DEVELOPER_EMAILS: ${{ vars.VITE_DEVELOPER_EMAILS }}
      - run: npm run typecheck
      # vitest is installed only for CI so package.json and package-lock.json stay in sync with production builds.
      - run: npm install --no-save vitest@2.1.9
      - run: npm test
      - run: npm run build
